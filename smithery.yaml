# Smithery configuration for @arispay/payagent-mcp
# https://smithery.ai/docs/config

name: payagent
displayName: PayAgent (ArisPay)
description: >
  One coherent USDC payment product for AI agents. Seven tools — setup,
  discover, inspect, pay, balance, history, check_payment_signal — pay
  any x402-priced API on
  Base, Solana, or BNB Chain under a server-enforced spend mandate
  (delegated custody, no private keys on the agent), or set
  PAYAGENT_PRIVATE_KEY to sign locally with no account. Every payment
  returns a structured receipt; pay requires an idempotency key so a
  retried call never double-pays. Settlement runs through the open
  ArisPay x402 facilitator (https://facilitator.arispay.app — no
  facilitator fee).

# MCP runtime — stdio subprocess via npx
runtime: stdio
command:
  type: npx
  name: "@arispay/payagent-mcp"

# User-configurable environment variables
env:
  ARISPAY_API_KEY:
    description: >
      Optional. ArisPay developer API key (ap_live_… / ap_test_…). The
      setup tool can self-provision one from just an email, and
      credentials persist to ~/.payagent/config.json. Alternatively set
      PAYAGENT_PRIVATE_KEY to sign locally with no account at all.
    required: false
  PAYAGENT_PRIVATE_KEY:
    description: >
      Optional. Hex private key of a funded EOA for local self-custody
      signing (no ArisPay account). pay signs in-process with it and
      balance shows its deposit address. Use a dedicated low-balance
      wallet.
    required: false
  PAYAGENT_MCP_PROFILE:
    description: >
      Optional. Set to "admin" to additionally load the four
      wallet-administration tools (create_agent, fund_agent,
      list_agents, rename_agent). Default: the seven core tools.
    required: false

tags:
  - payments
  - x402
  - wallet
  - usdc
  - micropayments
  - agentic-commerce

categories:
  - Finance

homepage: https://arispay.app
repository: https://github.com/arispay-inc/payagent-mcp
license: MIT

examples:
  - name: Pay a paid API
    description: Fetch an x402-protected URL, paying transparently with a receipt
    query: use pay to call https://api.example.com/paid-endpoint
  - name: Self-onboard from nothing
    description: Provision an account + mandate-bounded payer wallet in one call
    query: set up an ArisPay payer wallet for me with my email
  - name: Check the wallet
    description: Report the active identity, deposit address, and on-chain USDC balance
    query: what's my wallet balance?
